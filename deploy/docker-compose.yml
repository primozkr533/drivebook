# Test / demo server: web + worker + Postgres behind Caddy (automatic HTTPS).
# Run from this directory: docker compose up -d --build   (see deploy/README.md)

x-app-env: &app-env
  - PORT=3000
  - APP_ENV=production
  - DATABASE_URL=postgres://drivebook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/drivebook
  - BASE_DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
  - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in deploy/.env}
  - RUN_MIGRATIONS_ON_START=true
  - SEED_ON_START=true
  - SEED_SUPERADMIN_EMAIL=${SEED_SUPERADMIN_EMAIL:?set SEED_SUPERADMIN_EMAIL in deploy/.env}
  - PUBLIC_URL_SCHEME=https
  - PUBLIC_URL_PORT=
  # Demo: fake SMS / e-mail, readable in the dev inbox (https://DOMAIN/_dev/inbox, password-protected by Caddy).
  - NOTIFY_FAKE=${NOTIFY_FAKE:-1}
  - DEV_INBOX_ENABLED=${DEV_INBOX_ENABLED:-1}
  - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
  - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
  - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
  - BREVO_API_KEY=${BREVO_API_KEY:-}
  - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
  - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-DriveBook}
  - STORAGE_DIR=/data/storage

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - DEALER_HOSTS=${DEALER_HOSTS:?set DEALER_HOSTS in deploy/.env}
      - INBOX_USER=${INBOX_USER:-drivebook}
      - INBOX_PASSWORD_HASH=${INBOX_PASSWORD_HASH:?set INBOX_PASSWORD_HASH in deploy/.env}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ..
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The build stage has tsx and the sources the worker needs.
  worker:
    build:
      context: ..
      target: build
    command: ["npm", "run", "worker"]
    user: node
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=drivebook
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=drivebook
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivebook -d drivebook"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
